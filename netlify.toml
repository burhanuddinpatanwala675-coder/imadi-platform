[build]
  command = "echo 'Publishing Imadi static site'"
  publish = "public"

# The website is a multi-page static site, so no SPA rewrite is configured.
# The Express API and PostgreSQL database must be deployed separately.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
